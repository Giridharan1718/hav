name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hva
          POSTGRES_PASSWORD: hva
          POSTGRES_DB: hva_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U hva -d hva_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      HVA_TEST_DATABASE_URL: postgresql+psycopg://hva:hva@127.0.0.1:55432/hva_test
      HVA_DATABASE_URL: postgresql+psycopg://hva:hva@127.0.0.1:55432/hva_test
      HVA_ENV: test
      HVA_SECRET_KEY: ci-secret-key-that-is-long-enough-for-the-suite
      HVA_COOKIE_SECURE: "false"
      HVA_SMS_PROVIDER: mock
      HVA_EMAIL_PROVIDER: outbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pip-audit
      - name: Dependency audit
        working-directory: backend
        run: pip-audit
      - name: Lint
        working-directory: backend
        run: ruff check .
      - name: Tests (real PostgreSQL)
        working-directory: backend
        run: pytest
      - name: Seed development catalogue
        working-directory: backend
        run: python -m seed.seed --skip-link-check
      - name: Retrieval evaluation
        working-directory: backend
        run: python -m evaluation.run_eval

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Production build
        working-directory: frontend
        run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
