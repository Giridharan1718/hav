[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hva-backend"
version = "0.1.0"
description = "Human Vernacular Assist - privacy-first multilingual scheme assistance API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0.30,<2.1",
  "psycopg[binary]>=3.1,<4",
  "alembic>=1.13,<2",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "email-validator>=2.1,<3",
  "argon2-cffi>=23.1,<26",
  "cryptography>=48.0.1,<51",
  "pyotp>=2.9,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: requires a running PostgreSQL database",
  "security: security control regression tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI depends on call expressions in signatures.
# E501: long-form multilingual strings, URLs and SQLAlchemy column declarations cannot be
#       wrapped without making the reviewed scheme text unreadable; formatting is manual.
# UP042: explicit ``str, Enum`` mixins are intentional so JSON serialisation and SQLAlchemy
#        comparisons keep plain string values.
ignore = ["B008", "E501", "UP042"]
